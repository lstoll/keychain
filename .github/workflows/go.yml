name: Go (macOS)
on: [push]
jobs:

  build:
    name: Go ${{ matrix.go }} (CGO ${{ matrix.cgo == '1' && 'enabled' || 'disabled' }})
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: ${{ matrix.cgo }}
      # Runners are VMs, so Secure Enclave tests skip. Data protection tests
      # skip without entitlements.
      KEYCHAIN_INTEGRATION: 1
    strategy:
      fail-fast: false
      matrix:
        # Test the current and previous Go releases.
        go: [stable, oldstable]
        cgo: ['0', '1']

    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
      id: go

    # A dedicated, unlocked default keychain, so tests never depend on the
    # runner's login keychain state or hit a lock prompt.
    - name: Set up test keychain
      run: |
        kc="$RUNNER_TEMP/test.keychain-db"
        security create-keychain -p ci "$kc"
        security set-keychain-settings "$kc"
        security unlock-keychain -p ci "$kc"
        security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
        security default-keychain -d user -s "$kc"

    - name: Get dependencies
      run: go mod download

    - name: Build
      run: go build ./...

    - name: Test
      run: go test -v -timeout 10m ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
